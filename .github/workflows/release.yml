name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
      service_tag:
        description: Runtime, client, and frontend release tag
        required: true
        default: v1.0.0
      release_public_key:
        description: Base64 Ed25519 public key embedded into the launcher
        required: false
        default: ""

permissions:
  contents: write
  actions: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SERVICE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.service_tag || 'v1.0.0' }}
  APPIMAGETOOL_VERSION: 1.9.1
  RELEASE_PUBLIC_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.release_public_key || '' }}
  GONOSUMDB: github.com/good-fish-man/*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build launcher
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          extension=""
          if [ "$GOOS" = "windows" ]; then extension=".exe"; fi
          name="athena-launcher_${RELEASE_TAG}_${GOOS}_${GOARCH}$extension"
          mkdir -p dist
          version="${RELEASE_TAG#v}"
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-manifest.json"
          ldflags="-s -w -X athena-launcher/internal/launcher/deployment.LauncherVersion=$version -X athena-launcher/internal/launcher/deployment.DefaultManifestURL=$manifest_url"
          if [ -n "$RELEASE_PUBLIC_KEY" ]; then
            ldflags="$ldflags -X athena-launcher/internal/launcher/deployment.DefaultReleasePublicKey=$RELEASE_PUBLIC_KEY"
          fi
          go build -trimpath -ldflags "$ldflags" -o "dist/$name" ./cmd/athena-launcher
      - uses: actions/upload-artifact@v7
        with:
          name: athena-launcher-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  macos-dmg:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build macOS application
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-manifest.json"
          mkdir -p dist/bin
          ldflags="-s -w -X athena-launcher/internal/launcher/deployment.LauncherVersion=$version -X athena-launcher/internal/launcher/deployment.DefaultManifestURL=$manifest_url"
          if [ -n "$RELEASE_PUBLIC_KEY" ]; then
            ldflags="$ldflags -X athena-launcher/internal/launcher/deployment.DefaultReleasePublicKey=$RELEASE_PUBLIC_KEY"
          fi
          go build -trimpath -tags "desktop,production" -ldflags "$ldflags" -o "dist/bin/athena-launcher-${GOARCH}" ./cmd/athena-launcher
          BINARY="dist/bin/athena-launcher-${GOARCH}" VERSION="$version" ARCH="$GOARCH" ./packaging/macos/package-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: athena-dmg-${{ matrix.arch }}
          path: dist/installers/*.dmg
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $manifestUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/release-manifest.json"
          New-Item -ItemType Directory -Force -Path dist/bin, dist/installers | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          $ldflags = "-s -w -H windowsgui -X athena-launcher/internal/launcher/deployment.LauncherVersion=$version -X athena-launcher/internal/launcher/deployment.DefaultManifestURL=$manifestUrl"
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_PUBLIC_KEY)) {
            $ldflags += " -X athena-launcher/internal/launcher/deployment.DefaultReleasePublicKey=$env:RELEASE_PUBLIC_KEY"
          }
          go build -trimpath -tags "desktop,production" -ldflags $ldflags -o dist/bin/athena-launcher.exe ./cmd/athena-launcher
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_TAG.TrimStart("v")
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=$version" "/DSourceExe=$pwd\dist\bin\athena-launcher.exe" "/DOutputDir=$pwd\dist\installers" packaging/windows/athena.iss
      - uses: actions/upload-artifact@v7
        with:
          name: athena-windows-installer
          path: dist/installers/*.exe
          if-no-files-found: error

  linux-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            goarch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Linux launcher
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/release-manifest.json"
          mkdir -p dist/bin
          ldflags="-s -w -X athena-launcher/internal/launcher/deployment.LauncherVersion=$version -X athena-launcher/internal/launcher/deployment.DefaultManifestURL=$manifest_url"
          if [ -n "$RELEASE_PUBLIC_KEY" ]; then
            ldflags="$ldflags -X athena-launcher/internal/launcher/deployment.DefaultReleasePublicKey=$RELEASE_PUBLIC_KEY"
          fi
          go build -trimpath -tags "desktop,production,webkit2_41" -ldflags "$ldflags" -o "dist/bin/athena-launcher-${GOARCH}" ./cmd/athena-launcher
      - name: Build AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          curl --fail --location --retry 3 "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${APPIMAGE_ARCH}.AppImage" --output "$tool"
          chmod +x "$tool"
          BINARY="dist/bin/athena-launcher-${GOARCH}" VERSION="${RELEASE_TAG#v}" ARCH="$APPIMAGE_ARCH" APPIMAGETOOL="$tool" ./packaging/linux/package-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: athena-appimage-${{ matrix.appimage_arch }}
          path: dist/installers/*.AppImage
          if-no-files-found: error

  publish:
    needs: [build, macos-dmg, windows-installer, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Upload launcher assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum release/* > SHA256SUMS-launchers.txt
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" release/* SHA256SUMS-launchers.txt LICENSE NOTICE THIRD_PARTY_NOTICES.md --repo "$GITHUB_REPOSITORY" --clobber

  manifest:
    if: github.event_name == 'push'
    needs: publish
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/publish-manifest.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.service_tag || github.ref_name }}
      launcher_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      minimum_from_version: 0.9.0
    secrets: inherit

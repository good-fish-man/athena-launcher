name: Publish Release Manifest

on:
  workflow_call:
    inputs:
      tag:
        description: Runtime, client, and frontend release tag
        required: true
        type: string
      launcher_tag:
        description: Launcher release receiving the manifest and PostgreSQL assets
        required: true
        type: string
      postgres_version:
        description: PostgreSQL binary version
        required: false
        default: 16.13.0
        type: string
      agent_browser_version:
        description: Upstream agent-browser version
        required: false
        default: 0.34.0
        type: string
      minimum_from_version:
        description: Oldest installed Athena version allowed to upgrade directly
        required: false
        default: 0.9.0
        type: string
    secrets:
      ATHENA_RELEASE_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Runtime, client, and frontend release tag
        required: true
        default: v1.0.0
      launcher_tag:
        description: Launcher release receiving the manifest and PostgreSQL assets
        required: true
        default: v1.0.0
      postgres_version:
        description: PostgreSQL binary version
        required: true
        default: 16.13.0
      agent_browser_version:
        description: Upstream agent-browser version
        required: true
        default: 0.34.0
      minimum_from_version:
        description: Oldest installed Athena version allowed to upgrade directly
        required: true
        default: 0.9.0
permissions:
  contents: write
  actions: write

env:
  SERVICE_TAG: ${{ inputs.tag }}
  LAUNCHER_TAG: ${{ inputs.launcher_tag }}
  POSTGRES_VERSION: ${{ inputs.postgres_version }}
  AGENT_BROWSER_VERSION: ${{ inputs.agent_browser_version }}
  MINIMUM_FROM_VERSION: ${{ inputs.minimum_from_version }}

jobs:
  prerequisites:
    runs-on: ubuntu-latest
    steps:
      - name: Verify service releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=0
          for repo in agent-runtime agent-runtime-client athena-agent-ui; do
            if ! gh release view "$SERVICE_TAG" --repo "good-fish-man/$repo" >/dev/null 2>&1; then
              echo "::error title=Missing service release::good-fish-man/$repo has no GitHub Release named $SERVICE_TAG"
              echo "Create it with: gh workflow run release.yml -R good-fish-man/$repo --ref main -f tag=$SERVICE_TAG"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Wait for all service Release workflows to finish, then rerun Publish Release Manifest."
            exit 1
          fi

  postgres:
    needs: prerequisites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - darwin-arm64
          - darwin-amd64
          - linux-arm64
          - linux-amd64
          - windows-amd64
    steps:
      - uses: actions/checkout@v6
      - name: Package PostgreSQL
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIR: dist/postgres
        run: ./scripts/package-postgres.sh
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-${{ matrix.platform }}
          path: dist/postgres/*
          if-no-files-found: error

  manifest:
    needs: postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: postgres-*
          path: release-assets
          merge-multiple: true
      - name: Download service release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$SERVICE_TAG" --repo good-fish-man/agent-runtime --pattern "agent-runtime_${SERVICE_TAG}_*" --dir release-assets
          gh release download "$SERVICE_TAG" --repo good-fish-man/agent-runtime-client --pattern "agent-runtime-client_${SERVICE_TAG}_*" --dir release-assets
          gh release download "$SERVICE_TAG" --repo good-fish-man/athena-agent-ui --pattern "athena-agent-ui_${SERVICE_TAG}.tar.gz" --dir release-assets
          gh release download "v$AGENT_BROWSER_VERSION" --repo vercel-labs/agent-browser --pattern "agent-browser-darwin-arm64" --pattern "agent-browser-darwin-x64" --pattern "agent-browser-linux-arm64" --pattern "agent-browser-linux-x64" --pattern "agent-browser-win32-x64.exe" --dir release-assets
          version="${SERVICE_TAG#v}"
          major="${version%%.*}"
          if [[ "$major" =~ ^[0-9]+$ ]] && [[ "$major" -ge 1 ]]; then
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/good-fish-man/athena-protocol/${SERVICE_TAG}/compatibility/v1.0.json" --output compatibility-v1.0.json
          else
            printf '{}\n' > compatibility-v1.0.json
          fi
      - name: Enforce platform signing gate
        env:
          DARWIN_CODE_SIGNING_STATUS: ${{ vars.DARWIN_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
          WINDOWS_CODE_SIGNING_STATUS: ${{ vars.WINDOWS_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
          LINUX_CODE_SIGNING_STATUS: ${{ vars.LINUX_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
        run: |
          set -euo pipefail
          for status in "$DARWIN_CODE_SIGNING_STATUS" "$WINDOWS_CODE_SIGNING_STATUS" "$LINUX_CODE_SIGNING_STATUS"; do
            case "$status" in
              NOTARIZED|DEVELOPER_ID|AUTHENTICODE|GPG|COSIGN|PACKAGE_SIGNED|CHECKSUM_VERIFIED|THIRD_PARTY_UPSTREAM) ;;
              *) echo "::error title=Unsigned release blocked::Unsupported or non-production signing status: $status"; exit 1 ;;
            esac
          done
      - name: Generate and sign supply-chain manifest
        env:
          ASSET_DIR: release-assets
          OUTPUT: release-manifest.json
          TAG: ${{ inputs.tag }}
          LAUNCHER_TAG: ${{ inputs.launcher_tag }}
          ATHENA_RELEASE_PRIVATE_KEY: ${{ secrets.ATHENA_RELEASE_PRIVATE_KEY }}
          DARWIN_CODE_SIGNING_STATUS: ${{ vars.DARWIN_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
          WINDOWS_CODE_SIGNING_STATUS: ${{ vars.WINDOWS_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
          LINUX_CODE_SIGNING_STATUS: ${{ vars.LINUX_CODE_SIGNING_STATUS || 'CHECKSUM_VERIFIED' }}
        run: |
          set -euo pipefail
          test -n "$ATHENA_RELEASE_PRIVATE_KEY" || { echo "::error title=Missing release identity::ATHENA_RELEASE_PRIVATE_KEY is required"; exit 1; }
          ASSET_DIR=release-assets OUTPUT=release-sbom.spdx.json RELEASE_ID="athena-${TAG}" ./scripts/generate-release-sbom.sh
          SBOM_FILE=release-sbom.spdx.json COMPATIBILITY_FILE=compatibility-v1.0.json ./scripts/generate-release-manifest.sh
          go run ./cmd/release-manifest-sign --input release-manifest.json --output release-manifest.json --public-key-output release-public-key.txt
          jq empty release-manifest.json
          ATHENA_RELEASE_PUBLIC_KEY="$(cat release-public-key.txt)" go run ./cmd/athena-launcher validate --manifest release-manifest.json
          zip -q release-manifest.zip release-manifest.json
          sha256sum release-assets/postgres_* release-manifest.json release-manifest.zip release-sbom.spdx.json compatibility-v1.0.json > SHA256SUMS
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$LAUNCHER_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$LAUNCHER_TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$LAUNCHER_TAG"
          gh release upload "$LAUNCHER_TAG" release-assets/postgres_* release-manifest.json release-manifest.zip release-sbom.spdx.json compatibility-v1.0.json release-public-key.txt SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$LAUNCHER_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: |
            release-manifest.json
            release-manifest.zip
            release-sbom.spdx.json
            compatibility-v1.0.json
            release-public-key.txt
            SHA256SUMS
      - name: Rebuild launchers with embedded manifest URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tag="$LAUNCHER_TAG" -f service_tag="$SERVICE_TAG" -f release_public_key="$(cat release-public-key.txt)"
